id: jvm
title: La JVM de l'intérieur
description: >
  Ce qui se passe vraiment quand ton code Kotlin ou Java tourne : bytecode,
  chargement des classes, compilation à la volée, ramasse-miettes, outils de
  diagnostic et réglages.

levels:
  - level: 1
    title: Du code à la JVM
    skills:
      - id: bytecode
        title: Le bytecode et la machine à pile
      - id: zones-memoire
        title: Les zones mémoire de la JVM
      - id: boxing
        title: Types primitifs, boxing et cache des Integer
    boss:
      id: jvm.n1.boss
      title: "Boss : le gardien du bytecode"
      exercises:
        - jvm.n1.bytecode.parsons-ratio
        - jvm.n1.bytecode.qcm-pile
        - jvm.n1.bytecode.qcm-execution
        - jvm.n1.zones.match
        - jvm.n1.zones.qcm-metaspace
        - jvm.n1.boxing.predict-cache
      pass_ratio: 0.8
      time_limit_min: 10

  - level: 2
    title: Classes et exécution
    skills:
      - id: chargement-classes
        title: Chargement des classes et class loaders
      - id: initialisation
        title: Ordre d'initialisation
      - id: jit
        title: Interpréteur et compilation à la volée (JIT)
      - id: exceptions-jvm
        title: Exceptions et piles d'appels
    boss:
      id: jvm.n2.boss
      title: "Boss : le compilateur fantôme"
      exercises:
        - jvm.n2.initialisation.predict-parent-enfant
        - jvm.n2.initialisation.predict-object
        - jvm.n2.chargement.qcm-cast-impossible
        - jvm.n2.jit.match-optimisations
        - jvm.n2.jit.qcm-warmup
        - jvm.n2.exceptions.qcm-cause-racine
      pass_ratio: 0.8
      time_limit_min: 12

  - level: 3
    title: Le ramasse-miettes de HotSpot
    skills:
      - id: collecteurs
        title: "Les collecteurs : Serial, Parallel, G1, ZGC, Shenandoah"
      - id: g1
        title: G1 en détail
      - id: logs-gc
        title: Lire les logs du GC
      - id: choisir-gc
        title: Choisir et régler son GC
    boss:
      id: jvm.n3.boss
      title: "Boss : la pause du GC"
      exercises:
        - jvm.n3.collecteurs.match
        - jvm.n3.gc.scenario-latence
        - jvm.n3.logs.qcm-live-set
        - jvm.n3.options.trous-zgc
        - jvm.n2.initialisation.predict-parent-enfant
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 4
    title: Observer et régler
    skills:
      - id: options-jvm
        title: Les options de la JVM
      - id: outils-jdk
        title: jcmd, jstack, jmap, jstat
      - id: jfr
        title: Java Flight Recorder et Mission Control
      - id: optimisations-jit
        title: Inlining, escape analysis, désoptimisation
      - id: jvm-conteneurs
        title: La JVM dans un conteneur
    boss:
      id: jvm.n4.boss
      title: "Boss : l'OOMKilled silencieux"
      exercises:
        - jvm.n4.conteneurs.scenario-oomkilled
        - jvm.n4.outils.qcm-jstat
        - jvm.n4.jfr.qcm-production
        - jvm.n4.jit.qcm-escape
        - jvm.n4.outils.match-commandes
        - jvm.n4.conteneurs.qcm-tas-defaut
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 5
    title: Au-delà de HotSpot
    skills:
      - id: graalvm
        title: GraalVM et compilation native
      - id: ffm
        title: JNI et l'API Foreign Function & Memory
      - id: specification-jvm
        title: Lire la spécification de la JVM
      - id: langages-jvm
        title: Un bytecode, plusieurs langages
    boss:
      id: jvm.n5.boss
      title: "Boss : au-delà de HotSpot"
      exercises:
        - jvm.n5.graalvm.qcm-monde-ferme
        - jvm.n5.ffm.match
        - jvm.n5.langages.qcm-data-class
        - jvm.n5.graalvm.qcm-native
        - jvm.n4.conteneurs.scenario-oomkilled
      pass_ratio: 0.8
      time_limit_min: 10
