id: concurrence
title: Threads et concurrence
description: >
  Faire plusieurs choses à la fois sans corrompre ses données : threads,
  synchronisation, modèle mémoire, pools, coroutines, threads virtuels et
  algorithmes sans verrou.

levels:
  - level: 1
    title: Faire plusieurs choses à la fois
    skills:
      - id: concurrence-parallelisme
        title: Concurrence et parallélisme
      - id: processus-threads
        title: Processus et threads
      - id: creer-threads
        title: Créer et attendre des threads
      - id: race-condition
        title: Conditions de course
    boss:
      id: concurrence.n1.boss
      title: "Boss : la course aux données"
      exercises:
        - concurrence.n1.notions.qcm-concurrence-parallelisme
        - concurrence.n1.notions.qcm-partage
        - concurrence.n1.threads.predict-run-start
        - concurrence.n1.course.qcm-compteur
        - concurrence.n1.threads.predict-join
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 2
    title: Synchroniser
    skills:
      - id: synchronized
        title: Exclusion mutuelle et synchronized
      - id: visibilite-volatile
        title: Visibilité et volatile
      - id: atomiques
        title: Variables atomiques
      - id: interblocage
        title: Interblocages (deadlocks)
      - id: collections-concurrentes
        title: Collections concurrentes
    boss:
      id: concurrence.n2.boss
      title: "Boss : l'interblocage de minuit"
      exercises:
        - concurrence.n2.volatile.qcm-atomicite
        - concurrence.n2.interblocage.bug-virement
        - concurrence.n2.collections.trous-merge
        - concurrence.n2.conception.qcm-eviter
        - concurrence.n2.interblocage.scenario-prod
      pass_ratio: 0.8
      time_limit_min: 12

  - level: 3
    title: Les outils de haut niveau
    skills:
      - id: jmm
        title: Le modèle mémoire Java (happens-before)
      - id: executors
        title: Pools de threads et executors
      - id: futures
        title: Future et CompletableFuture
      - id: verrous-avances
        title: ReentrantLock, ReadWriteLock et conditions
      - id: threadlocal
        title: ThreadLocal
    boss:
      id: concurrence.n3.boss
      title: "Boss : le pool épuisé"
      exercises:
        - concurrence.n3.jmm.qcm-reordonnancement
        - concurrence.n3.executors.review-meteo
        - concurrence.n3.verrous.bug-finally
        - concurrence.n3.threadlocal.predict-pool
        - concurrence.n3.jmm.match-arrive-avant
        - concurrence.n3.jmm.bug-double-checked
      pass_ratio: 0.8
      time_limit_min: 13

  - level: 4
    title: Concurrence moderne
    skills:
      - id: coroutines
        title: Coroutines Kotlin
      - id: concurrence-structuree
        title: Concurrence structurée et annulation
      - id: threads-virtuels
        title: Threads virtuels
      - id: flux-reactifs
        title: Flux réactifs et backpressure
    boss:
      id: concurrence.n4.boss
      title: "Boss : la coroutine annulée"
      exercises:
        - concurrence.n4.annulation.bug-catch-exception
        - concurrence.n4.virtuels.qcm-quand
        - concurrence.n4.flux.match-contre-pression
        - concurrence.n4.structuree.predict-echec
        - concurrence.n4.coroutines.trous-viewmodel
        - concurrence.n4.flux.qcm-unlimited
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 5
    title: Concurrence experte
    skills:
      - id: sans-verrou
        title: Algorithmes sans verrou, CAS et problème ABA
      - id: barrieres-memoire
        title: Barrières mémoire et réordonnancement
      - id: acteurs
        title: Le modèle d'acteurs
      - id: tester-concurrence
        title: Tester du code concurrent
      - id: concevoir-concurrent
        title: Concevoir pour la concurrence
    boss:
      id: concurrence.n5.boss
      title: "Boss : le verrou invisible"
      exercises:
        - concurrence.n5.cas.parsons-empiler
        - concurrence.n5.tests.match-outils
        - concurrence.n5.acteurs.qcm-principe
        - concurrence.n5.contention.qcm-longadder
        - concurrence.n5.cas.qcm-aba
        - concurrence.n5.conception.qcm-ordre
      pass_ratio: 0.8
      time_limit_min: 10
