id: memoire
title: Gestion de la mémoire
description: >
  Où vivent tes données, combien de temps, et qui les libère. De la pile et du
  tas jusqu'aux ramasse-miettes, aux fuites et aux caches du processeur.

levels:
  - level: 1
    title: Pile et tas
    skills:
      - id: pile-tas
        title: La pile et le tas
      - id: valeurs-references
        title: Valeurs et références
      - id: duree-de-vie
        title: Portée et durée de vie des objets
      - id: representation
        title: Taille et représentation des données
    boss:
      id: memoire.n1.boss
      title: "Boss : la pile qui déborde"
      exercises:
        - memoire.n1.pile.qcm-vrai-faux
        - memoire.n1.valeurs.predict-references
        - memoire.n1.representation.qcm-liste-int
        - memoire.n1.pile.qcm-recursion
      pass_ratio: 0.75
      time_limit_min: 8

  - level: 2
    title: Gérer la mémoire à la main
    skills:
      - id: allocation-manuelle
        title: Allocation manuelle (malloc et free)
      - id: bugs-memoire
        title: Fuites, use-after-free, double libération, débordements
      - id: raii
        title: RAII et destructeurs
      - id: comptage-references
        title: Comptage de références et cycles
      - id: ownership
        title: Possession et emprunt (Rust)
    boss:
      id: memoire.n2.boss
      title: "Boss : le pointeur fou"
      exercises:
        - memoire.n2.bugs.bug-dupliquer
        - memoire.n2.raii.predict-drop
        - memoire.n2.comptage.predict-cycle
        - memoire.n2.ownership.qcm-push
        - memoire.n2.bugs.match
        - memoire.n2.bugs.qcm-use-after-free
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 3
    title: Les ramasse-miettes
    skills:
      - id: accessibilite
        title: Racines et accessibilité
      - id: mark-sweep
        title: Marquer, balayer, compacter
      - id: gc-copie
        title: Ramasse-miettes par copie
      - id: generationnel
        title: L'hypothèse générationnelle
      - id: pauses-gc
        title: Pauses, GC concurrent et barrières
    boss:
      id: memoire.n3.boss
      title: "Boss : le ramasse-miettes"
      exercises:
        - memoire.n3.accessibilite.qcm-cycle
        - memoire.n3.algorithmes.match
        - memoire.n3.pauses.qcm-compromis
        - memoire.n3.generationnel.qcm-pourquoi
        - memoire.n2.bugs.bug-dupliquer
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 4
    title: Fuites et diagnostic
    skills:
      - id: fuites-gc
        title: Fuites de mémoire malgré le GC
      - id: references-faibles
        title: Références faibles, douces et fantômes
      - id: heap-dump
        title: Analyser un heap dump
      - id: hors-tas
        title: Mémoire hors tas et buffers directs
    boss:
      id: memoire.n4.boss
      title: "Boss : la fuite invisible"
      exercises:
        - memoire.n4.fuites.review-cache-threadlocal
        - memoire.n4.references.qcm-weak
        - memoire.n4.hors-tas.scenario-rss
        - memoire.n4.fuites.bug-ecouteur
        - memoire.n4.hors-tas.qcm-direct
        - memoire.n4.heap-dump.qcm-retained
      pass_ratio: 0.8
      time_limit_min: 13

  - level: 5
    title: Mémoire et performance
    skills:
      - id: allocateurs
        title: Allocateurs (arènes, pools, slabs)
      - id: fragmentation
        title: Fragmentation
      - id: caches-cpu
        title: Caches du processeur et localité
      - id: faux-partage
        title: Faux partage (false sharing)
      - id: disposition-objets
        title: Disposition des objets en mémoire
    boss:
      id: memoire.n5.boss
      title: "Boss : le cache du processeur"
      exercises:
        - memoire.n5.allocateurs.match
        - memoire.n5.fragmentation.qcm
        - memoire.n5.caches.qcm-lignes-colonnes
        - memoire.n5.faux-partage.qcm-compteurs
        - memoire.n5.disposition.qcm-tableaux
      pass_ratio: 0.8
      time_limit_min: 8
