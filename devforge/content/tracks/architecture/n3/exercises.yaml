exercises:
  - id: architecture.n3.hexagonale.qcm-dependances
    type: qcm
    title: Le sens des dépendances
    skills: [hexagonale, clean-architecture]
    difficulty: 2
    prompt: Dans une architecture hexagonale, dans quel sens vont les dépendances du code ?
    choices:
      - id: a
        text: Des adaptateurs (UI, base de données, API) vers le domaine. Le domaine ne dépend de rien d'extérieur.
        correct: true
      - id: b
        text: Du domaine vers la base de données, car le domaine a besoin de lire ses données.
        feedback: "C'est l'inverse : le domaine définit un port (interface), la base l'implémente."
      - id: c
        text: De l'interface utilisateur vers la base de données, en passant par le domaine.
        feedback: C'est l'architecture en couches classique, où le métier dépend de la persistance.
      - id: d
        text: Dans les deux sens, tant qu'on passe par des interfaces.
    explanation: |
      Le domaine est au centre et définit des **ports** (interfaces) : « j'ai besoin
      d'enregistrer une tentative ». Les **adaptateurs** (Room, Ktor, Compose…)
      implémentent ou appellent ces ports. Résultat : on peut tester tout le métier
      sans Android ni base de données, et changer de technologie sans toucher au métier.

  - id: architecture.n3.hexagonale.review-cas-usage
    type: code-review
    title: "Revue de code : un cas d'usage trop bavard"
    skills: [hexagonale, clean-architecture, ddd-tactique]
    difficulty: 3
    language: kotlin
    prompt: |
      Ce cas d'usage est censé faire partie du **domaine** de DevForge.
      Trouve au moins 3 problèmes.
    code: |
      class TerminerExercice(
          private val dao: AttemptDao,       // Room
          private val context: Context,      // Android
      ) {
          fun executer(exerciceId: String, correct: Boolean) {
              dao.insert(AttemptEntity(exerciceId, correct, System.currentTimeMillis()))
              if (correct) {
                  val prefs = context.getSharedPreferences("xp", Context.MODE_PRIVATE)
                  val xp = prefs.getInt("xp", 0) + 10
                  prefs.edit().putInt("xp", xp).apply()
              }
          }
      }
    issues:
      - lines: [2, 6]
        category: conception
        description: |
          Le domaine dépend directement de Room. Il devrait dépendre d'un port
          `AttemptRepository` qu'il définit lui-même, implémenté par un adaptateur Room.
      - lines: [3, 8]
        category: conception
        description: |
          Dépendance au framework Android dans le domaine : impossible à tester
          en JVM pur, impossible à réutiliser ailleurs. Port `XpStore` à la place.
      - lines: [6]
        category: test
        description: "`System.currentTimeMillis()` : l'heure n'est pas injectable, les tests ne sont pas déterministes. Injecter une `Clock`."
      - lines: [9, 10]
        category: bug
        description: "Lire puis réécrire l'XP n'est pas atomique : deux validations simultanées peuvent perdre de l'XP."
      - lines: [9]
        category: lisibilite
        description: "XP en dur (`10`) : la règle métier (XP selon la difficulté) est noyée dans de la plomberie."
    min_found: 3
    explanation: |
      Version hexagonale :

      ```kotlin
      class TerminerExercice(
          private val tentatives: AttemptRepository, // port
          private val xp: XpStore,                   // port
          private val horloge: Clock,
          private val regles: ReglesXp,
      ) {
          suspend fun executer(exercice: Exercice, correct: Boolean) {
              tentatives.enregistrer(Tentative(exercice.id, correct, horloge.instant()))
              if (correct) xp.ajouter(regles.pour(exercice))
          }
      }
      ```

      Le domaine ne connaît plus ni Room ni Android : il se teste avec des fakes,
      en quelques millisecondes.

  - id: architecture.n3.ddd.predict-montant
    type: predict-output
    title: Des montants qui se défendent
    skills: [ddd-tactique]
    difficulty: 3
    language: kotlin
    prompt: Qu'affiche ce programme ?
    code: |
      data class Montant(val centimes: Long, val devise: String) {
          operator fun plus(autre: Montant): Montant {
              require(devise == autre.devise) { "devises différentes : $devise et ${autre.devise}" }
              return Montant(centimes + autre.centimes, devise)
          }
      }

      fun main() {
          println(Montant(1050, "EUR") + Montant(250, "EUR"))
          println(Montant(100, "EUR") == Montant(100, "EUR"))
          try {
              Montant(100, "EUR") + Montant(100, "USD")
          } catch (e: IllegalArgumentException) {
              println(e.message)
          }
      }
    choices:
      - id: a
        text: "`Montant(centimes=1300, devise=EUR)` / `true` / `devises différentes : EUR et USD`"
        correct: true
      - id: b
        text: "`Montant(centimes=1300, devise=EUR)` / `false` / `devises différentes : EUR et USD`"
        feedback: "Une data class compare les valeurs : deux montants identiques sont égaux, c'est ce qui en fait un objet-valeur."
      - id: c
        text: "`Montant(centimes=1300, devise=EUR)` / `true` / `Montant(centimes=200, devise=EUR)`"
        feedback: "`require` refuse l'addition de devises différentes."
      - id: d
        text: "`1300` / `true` / `devises différentes : EUR et USD`"
    explanation: |
      Un objet-valeur est défini par ses valeurs (égalité structurelle), immuable, et il
      protège ses règles : on ne peut pas additionner des euros et des dollars par accident,
      ce qu'un `Long` nu n'empêcherait jamais. Sortie vérifiée.

  - id: architecture.n3.ddd.bug-agregat
    type: find-bug
    title: L'invariant contourné
    skills: [ddd-tactique]
    difficulty: 3
    language: kotlin
    prompt: |
      Une commande validée ne doit plus changer, et elle a au plus 50 lignes. Pourtant, on a
      trouvé en base des commandes validées de 80 lignes. Touche la ligne qui le permet.
    code: |
      class Commande(val id: CommandeId) {
          val lignes = mutableListOf<Ligne>()
          var statut = Statut.BROUILLON
              private set

          fun ajouter(ligne: Ligne) {
              check(statut == Statut.BROUILLON) { "commande déjà validée" }
              require(lignes.size < 50) { "50 lignes maximum" }
              lignes += ligne
          }
      }
    bug_lines: [2]
    hints:
      - Faut-il forcément passer par `ajouter` pour ajouter une ligne ?
    explanation: |
      `lignes` est une liste **modifiable et publique** : n'importe quel code peut écrire
      `commande.lignes.add(...)` et contourner les deux règles. La racine de l'agrégat doit
      garder la liste privée et n'exposer qu'une vue en lecture seule (`private val _lignes`
      + `val lignes: List<Ligne> get() = _lignes.toList()`).

  - id: architecture.n3.ddd.match-briques
    type: match
    title: Les briques du DDD tactique
    skills: [ddd-tactique]
    difficulty: 2
    prompt: Relie chaque élément du domaine d'une boutique à la brique DDD qui lui correspond.
    pairs:
      - left: Un montant de 12,50 €
        right: Objet-valeur
      - left: "Le client n°4821, même s'il change d'adresse"
        right: Entité
      - left: La commande et ses lignes, modifiées ensemble
        right: Agrégat
      - left: "« Commande validée », publié à la validation"
        right: Événement du domaine
      - left: "trouver(id) et enregistrer(commande)"
        right: Dépôt (repository)
    explanation: |
      Objet-valeur : défini par sa valeur. Entité : définie par son identité. Agrégat : une
      frontière de cohérence avec une racine. Événement : un fait passé. Dépôt : l'accès aux
      agrégats, sous forme de port.

  - id: architecture.n3.clean.qcm-regle
    type: qcm
    title: La règle de dépendance
    skills: [clean-architecture]
    difficulty: 3
    language: kotlin
    prompt: Cette entité vit dans le cercle le plus intérieur de la Clean Architecture. Qu'est-ce qui pose problème ?
    code: |
      @Entity
      @Table(name = "comptes")
      class Compte(
          @Id val id: Long,
          @Column(name = "solde") var solde: Long,
      )
    choices:
      - id: a
        text: "Les annotations JPA font dépendre le cœur du domaine d'un framework de persistance, situé dans le cercle le plus extérieur."
        correct: true
      - id: b
        text: "`var solde` devrait être un `val`."
        feedback: "Discutable, mais ce n'est pas la règle de dépendance."
      - id: c
        text: Il manque une interface `ICompte`.
      - id: d
        text: Rien, les annotations ne sont que des métadonnées.
        feedback: "Le code source du domaine importe `jakarta.persistence` : il ne compile plus sans le framework."
    explanation: |
      La règle de dépendance interdit à un cercle intérieur de connaître un nom d'un cercle
      extérieur. Solution stricte : une entité de persistance séparée dans l'adaptateur, et un
      *mapping*. Compromis fréquent et assumé : tolérer les annotations JPA dans le domaine
      quand le métier est simple ; l'important est de le décider en connaissance de cause.
