id: linux
title: Linux et shell
description: >
  Le terminal, les fichiers, les processus et les outils qui font tourner presque tous
  les serveurs du monde ; jusqu'à diagnostiquer une machine en production.

levels:
  - level: 1
    title: Le terminal
    skills:
      - id: navigation
        title: Naviguer dans les fichiers
      - id: permissions
        title: Les permissions
      - id: pipes-redirections
        title: Pipes et redirections

  - level: 2
    title: Les outils du quotidien
    skills:
      - id: texte
        title: grep, sort, uniq, awk, sed, find
      - id: scripts-bash
        title: Écrire des scripts bash fiables
      - id: processus-signaux
        title: Processus et signaux
      - id: environnement
        title: Variables d'environnement

  - level: 3
    title: Administrer une machine
    skills:
      - id: systemd
        title: Services avec systemd et journalctl
      - id: reseau-commandes
        title: Le réseau en ligne de commande
      - id: ssh
        title: SSH et clés
      - id: planification
        title: Tâches planifiées (cron, timers)

  - level: 4
    title: Diagnostiquer
    skills:
      - id: charge-performance
        title: Charge, CPU, mémoire, disque
      - id: strace-lsof
        title: strace et lsof
      - id: systemes-fichiers
        title: Disques, inodes et systèmes de fichiers
      - id: conteneurs-linux
        title: cgroups et namespaces

  - level: 5
    title: Sous le capot
    skills:
      - id: appels-systeme
        title: Appels système
      - id: ordonnanceur
        title: L'ordonnanceur et la mémoire virtuelle
      - id: durcissement
        title: Durcir un serveur
      - id: ebpf
        title: eBPF, l'observabilité moderne
