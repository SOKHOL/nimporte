id: fondations
title: Fondations de la programmation
description: >
  Les bases que tout le reste suppose : variables, types, conditions, boucles,
  fonctions, collections, récursivité, erreurs, complexité, génériques, et la façon
  d'apprendre n'importe quel langage.

levels:
  - level: 1
    title: Les briques de base
    skills:
      - id: variables-types
        title: Variables et types
      - id: operateurs
        title: Opérateurs et calculs
      - id: conditions
        title: Conditions
      - id: boucles
        title: Boucles
      - id: fonctions
        title: Fonctions

  - level: 2
    title: Organiser les données
    skills:
      - id: collections
        title: Listes, ensembles et dictionnaires
      - id: chaines
        title: Chaînes de caractères
      - id: portee
        title: Portée des variables
      - id: recursivite
        title: Récursivité
      - id: exceptions
        title: Gestion des erreurs

  - level: 3
    title: Ce que coûte le code
    skills:
      - id: complexite
        title: Complexité (notation grand O)
      - id: structures-adaptees
        title: Choisir la bonne structure de données
      - id: nullabilite
        title: Nullabilité
      - id: typage
        title: Typage statique et dynamique

  - level: 4
    title: Abstraire et assembler
    skills:
      - id: generiques
        title: Génériques
      - id: variance
        title: Variance (in et out)
      - id: compilation-execution
        title: Compilation et exécution
      - id: modules
        title: Modules, paquets et dépendances

  - level: 5
    title: Apprendre n'importe quel langage
    skills:
      - id: paradigmes
        title: Les paradigmes de programmation
      - id: comparer-langages
        title: Comparer Kotlin, Python, Go, Rust et TypeScript
      - id: apprendre-langage
        title: Apprendre un langage en une semaine
