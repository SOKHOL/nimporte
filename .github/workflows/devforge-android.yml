name: DevForge – app Android

on:
  push:
    paths:
      - "devforge/**"
      - ".github/workflows/devforge-android.yml"
  pull_request:
    paths:
      - "devforge/**"
      - ".github/workflows/devforge-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devforge/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests des modules Kotlin (modèle, Markdown, domaine, données)
        run: ./gradlew --no-daemon :core:model:test :core:markdown:test :core:domain:test :core:data:test

      - name: Compiler l'APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DevForge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DevForge-apk
          path: devforge/android/DevForge.apk

  smoke-test:
    name: Test de fumée sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'app sur un émulateur Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          working-directory: devforge/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-test-de-fumee
          path: devforge/android/app/build/reports/androidTests/

  release:
    name: Publier l'APK
    needs: [build, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DevForge-apk

      - name: Publier la pré-version « devforge-latest »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete devforge-latest --yes --cleanup-tag || true
          gh release create devforge-latest DevForge.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "DevForge — dernière version (${GITHUB_SHA::7})" \
            --notes "APK construit et testé sur émulateur depuis la branche ${GITHUB_REF_NAME}. Sur Android : télécharge DevForge.apk, ouvre-le et autorise l'installation depuis cette source."
