id: fonctionnel
title: Programmation fonctionnelle
description: >
  Penser en fonctions et en valeurs : immutabilité, fonctions pures, composition, types
  algébriques, erreurs sans exceptions, paresse, monades en pratique, et un détour par le
  lambda-calcul.

levels:
  - level: 1
    title: Les fonctions comme valeurs
    skills:
      - id: lambdas
        title: Lambdas et fonctions d'ordre supérieur
      - id: map-filter-reduce
        title: map, filter, reduce et compagnie
      - id: immutabilite
        title: L'immutabilité
    boss:
      id: fonctionnel.n1.boss
      title: "Boss : la fermeture piégée"
      exercises:
        - fonctionnel.n1.lambdas.predict-capture
        - fonctionnel.n1.map-filter.match
        - fonctionnel.n1.immutabilite.qcm
        - fonctionnel.n1.immutabilite.predict-vue
        - fonctionnel.n1.map-filter.predict-pipeline
      pass_ratio: 0.8
      time_limit_min: 10

  - level: 2
    title: Penser en fonctions
    skills:
      - id: fonctions-pures
        title: Fonctions pures et effets de bord
      - id: composition
        title: Composition et application partielle
      - id: types-algebriques
        title: Types algébriques et pattern matching
    boss:
      id: fonctionnel.n2.boss
      title: "Boss : l'état impossible"
      exercises:
        - fonctionnel.n2.pures.match
        - fonctionnel.n2.composition.predict-slug
        - fonctionnel.n2.types.qcm-exhaustif
        - fonctionnel.n2.types.qcm-impossible
        - fonctionnel.n2.pures.qcm-avantage
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 3
    title: Erreurs, paresse et récursion
    skills:
      - id: erreurs-fonctionnelles
        title: Option, Result et Either
      - id: paresse
        title: L'évaluation paresseuse
      - id: recursion-terminale
        title: Récursion et récursion terminale
    boss:
      id: fonctionnel.n3.boss
      title: "Boss : la séquence paresseuse"
      exercises:
        - fonctionnel.n3.erreurs.predict-result
        - fonctionnel.n3.paresse.qcm-infini
        - fonctionnel.n3.recursion.predict-tailrec
        - fonctionnel.n3.erreurs.match
        - fonctionnel.n3.paresse.predict-sequence
      pass_ratio: 0.8
      time_limit_min: 10

  - level: 4
    title: Les abstractions fonctionnelles
    skills:
      - id: foncteurs-monades
        title: Foncteurs et monades en pratique
      - id: effets
        title: Isoler les effets
      - id: combinateurs
        title: Combinateurs et DSL
    boss:
      id: fonctionnel.n4.boss
      title: "Boss : la monade cachée"
      exercises:
        - fonctionnel.n4.monades.predict-flatmap
        - fonctionnel.n4.effets.qcm
        - fonctionnel.n4.combinateurs.qcm
        - fonctionnel.n4.monades.match
        - fonctionnel.n3.paresse.predict-sequence
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 5
    title: Aux sources
    skills:
      - id: structures-persistantes
        title: Structures de données persistantes
      - id: lambda-calcul
        title: Le lambda-calcul
      - id: langages-purs
        title: Haskell et les langages purs
      - id: categories
        title: Un aperçu de la théorie des catégories
    boss:
      id: fonctionnel.n5.boss
      title: "Boss : le lambda-calcul"
      exercises:
        - fonctionnel.n5.persistantes.predict-partage
        - fonctionnel.n5.lambda.qcm-turing
        - fonctionnel.n5.langages.match
        - fonctionnel.n5.categories.qcm-monoide
        - fonctionnel.n5.lambda.predict-church
      pass_ratio: 0.8
      time_limit_min: 9
