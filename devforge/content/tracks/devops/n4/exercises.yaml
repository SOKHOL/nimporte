exercises:
  - id: devops.n4.incident-crashloop
    type: scenario
    title: "Astreinte : 3 h du matin"
    skills: [kubernetes-debug, kubernetes]
    difficulty: 3
    language: bash
    prompt: |
      Tu es d'astreinte. Ton téléphone sonne. Résous l'incident en un minimum
      d'étapes : chaque décision compte.
    start: alerte
    nodes:
      alerte:
        text: |
          🚨 03:12 — L'API `devforge-api` ne répond plus.

          ```
          $ kubectl get pods
          NAME                           READY   STATUS             RESTARTS   AGE
          devforge-api-7d9f8c6b5-x2k4p   0/1     CrashLoopBackOff   6          9m
          ```

          Que fais-tu en premier ?
        options:
          - text: Je supprime le pod pour qu'il soit recréé.
            next: suppression
            points: 0
            feedback: Le pod sera recréé… et plantera de la même façon.
          - text: "Je lis les logs du dernier crash : `kubectl logs <pod> --previous`"
            next: logs
            points: 3
            feedback: "Bon réflexe : `--previous` montre les logs du conteneur qui vient de planter."
          - text: J'augmente le nombre de réplicas à 5.
            next: replicas
            points: 0
            feedback: "5 pods qui plantent au lieu d'un : le problème n'est pas la charge."

      suppression:
        text: Le nouveau pod repasse en `CrashLoopBackOff` au bout de 30 secondes. Et maintenant ?
        options:
          - text: Je lis les logs du dernier crash.
            next: logs
            points: 2

      replicas:
        text: Les 5 pods sont en `CrashLoopBackOff` et le canal #incidents s'affole. Et maintenant ?
        options:
          - text: Je reviens à 1 réplica et je lis les logs du dernier crash.
            next: logs
            points: 1

      logs:
        text: |
          ```
          Exception in thread "main" java.lang.IllegalStateException: DATABASE_URL manquante
              at devforge.ConfigKt.loadConfig(Config.kt:12)
          ```

          Le dernier déploiement date de 03:05. Quelle est l'hypothèse la plus probable ?
        options:
          - text: La base de données est en panne.
            next: fausse-piste-bdd
            points: 0
            feedback: Le message dit que la *variable* est absente, pas que la base est injoignable.
          - text: Le déploiement de 03:05 a cassé la configuration (variable d'environnement absente).
            next: diagnostic
            points: 3

      fausse-piste-bdd:
        text: |
          La base répond (`pg_isready` OK) et les autres services l'utilisent sans
          problème. Que regardes-tu ?
        options:
          - text: Ce qui a changé dans le déploiement de 03:05.
            next: diagnostic
            points: 1

      diagnostic:
        text: |
          `kubectl describe deployment devforge-api` montre que la variable
          `DATABASE_URL`, lue auparavant depuis le secret `api-db`, a disparu du
          manifeste dans le dernier commit.

          Comment rétablis-tu le service **le plus vite possible** ?
        options:
          - text: "`kubectl rollout undo deployment/devforge-api`, puis je corrige le manifeste dans Git."
            next: resolu
            points: 3
            feedback: "D'abord rétablir le service (rollback), ensuite corriger la cause proprement."
          - text: Je corrige le manifeste, j'ouvre une PR et j'attends la CI (15 minutes).
            next: resolu-lent
            points: 1
            feedback: Correct, mais le service reste en panne pendant ce temps.
          - text: "J'ajoute la variable à la main avec `kubectl edit`."
            next: derive
            points: 1
            feedback: "Ça marche, mais la prod ne correspond plus à Git : le prochain déploiement recassera tout."

      resolu:
        ending: success
        text: |
          ✅ Service rétabli en 2 minutes. Dernière étape : le post-mortem
          (chronologie, cause, actions : test de démarrage en CI, validation des manifestes).
      resolu-lent:
        ending: partial
        text: 🟡 Service rétabli après 20 minutes de panne. Un rollback aurait évité 18 minutes d'interruption.
      derive:
        ending: partial
        text: 🟡 Service rétabli, mais la prod a dérivé de Git. En GitOps, Git est la seule source de vérité.
    explanation: |
      La démarche type face à un `CrashLoopBackOff` :
      1. **Observer** avant d'agir : `kubectl logs --previous`, `kubectl describe pod`.
      2. **Chercher ce qui a changé** : un incident suit très souvent un déploiement.
      3. **Rétablir d'abord** (rollback), **corriger ensuite** (dans Git, avec revue et CI).
      4. **Apprendre** : un post-mortem sans blâme et des actions pour que ça ne se reproduise pas.

  - id: devops.n4.terraform.qcm-plan
    type: qcm
    title: Lire un plan Terraform
    skills: [terraform]
    difficulty: 3
    language: text
    prompt: Que va faire Terraform si l'on applique ce plan ?
    code: |
      # terraform_data.serveur_api will be updated in-place
      ~ resource "terraform_data" "serveur_api" {
          ~ input  = {
              ~ replicas = 2 -> "4"
      Plan: 0 to add, 1 to change, 0 to destroy.
    choices:
      - id: a
        text: "Modifier la ressource existante sur place (le ~), sans la détruire."
        correct: true
      - id: b
        text: Détruire la ressource puis la recréer.
        feedback: "Ce serait signalé par `-/+` et « must be replaced »."
      - id: c
        text: Créer une seconde ressource.
        feedback: "Ce serait un `+` et « 1 to add »."
      - id: d
        text: Rien, le plan est seulement informatif.
    explanation: |
      Sortie réelle de Terraform 1.9.8 après `terraform plan -var replicas=4`. Le symbole
      compte : un `-/+` sur une base de données signifie une base recréée, donc vide.

  - id: devops.n4.terraform.qcm-etat
    type: qcm
    title: L'état Terraform en équipe
    skills: [terraform]
    difficulty: 3
    prompt: "Pourquoi stocker l'état Terraform à distance, avec un verrou, plutôt que dans le dépôt Git ou sur un poste ?"
    choices:
      - id: a
        text: "Pour que toute l'équipe et la CI partagent le même état, que deux apply simultanés ne le corrompent pas, et parce qu'il contient souvent des secrets."
        correct: true
      - id: b
        text: Parce que Terraform ne sait pas lire un fichier local.
      - id: c
        text: Pour que le plan soit plus rapide.
      - id: d
        text: Ce n'est utile qu'avec plus de 100 ressources.
    explanation: |
      L'état fait le lien entre le code et les ressources réelles. Partagé, verrouillé
      pendant chaque opération, chiffré et à accès restreint.

  - id: devops.n4.kubernetes.match-statuts
    type: match
    title: Lire l'état d'un pod
    skills: [kubernetes-debug]
    difficulty: 3
    prompt: Relie chaque statut de pod à sa cause la plus probable.
    pairs:
      - left: Pending
        right: Aucun nœud n'a assez de ressources pour ses requests
      - left: ImagePullBackOff
        right: Tag d'image inexistant ou registre privé sans identifiants
      - left: CrashLoopBackOff
        right: Le conteneur plante au démarrage, en boucle
      - left: OOMKilled
        right: Limite mémoire du conteneur dépassée
      - left: "Running, mais 0/1 READY"
        right: La readiness probe échoue
    explanation: |
      `kubectl describe pod` (section Events) et `kubectl logs --previous` donnent presque
      toujours la cause précise.

  - id: devops.n4.kubernetes.qcm-liveness
    type: qcm
    title: La sonde qui redémarre tout
    skills: [kubernetes]
    difficulty: 4
    prompt: |
      La liveness probe de l'API appelle `/sante`, qui vérifie aussi la connexion à la base.
      La base est lente pendant 2 minutes. Que se passe-t-il ?
    choices:
      - id: a
        text: "Kubernetes redémarre tous les pods de l'API en boucle, alors qu'ils n'avaient rien : la panne de la base devient une panne de l'API."
        correct: true
      - id: b
        text: Kubernetes retire simplement les pods du Service.
        feedback: "C'est l'effet d'une readiness probe, pas d'une liveness."
      - id: c
        text: Kubernetes redémarre la base.
      - id: d
        text: Rien, les sondes ne regardent que le processus.
    explanation: |
      La liveness doit seulement vérifier que le processus n'est pas bloqué. Les dépendances
      se reflètent, au plus, dans la readiness (et même là, avec prudence).

  - id: devops.n4.kubernetes.trous-ressources
    type: fill-blanks
    title: Requests et limits
    skills: [kubernetes]
    difficulty: 3
    language: yaml
    prompt: |
      Complète la configuration : l'ordonnanceur doit réserver 250 millicœurs et 512 Mio pour
      placer le pod, et le conteneur ne doit jamais dépasser 768 Mio.
    code: |
      resources:
        {{1}}:
          cpu: 250m
          memory: 512Mi
        {{2}}:
          memory: 768Mi
    blanks:
      "1":
        answers: [requests]
        options: [requests, limits, reserved, minimum]
      "2":
        answers: [limits]
        options: [limits, requests, maximum, quota]
    explanation: |
      `requests` sert au placement ; `limits` est un plafond. Au-delà de la limite mémoire,
      le conteneur est tué (OOMKilled) ; au-delà de la limite CPU, il est bridé.

  - id: devops.n4.ansible.qcm-idempotence
    type: qcm
    title: Lancer deux fois
    skills: [ansible]
    difficulty: 2
    language: yaml
    prompt: On lance ce playbook une deuxième fois, sur un serveur où nginx est déjà installé. Que fait la tâche ?
    code: |
      - name: Installer nginx
        ansible.builtin.apt:
          name: nginx
          state: present
    choices:
      - id: a
        text: "Rien : l'état voulu (présent) est déjà atteint, Ansible affiche « ok » et pas « changed »."
        correct: true
      - id: b
        text: Elle réinstalle nginx.
      - id: c
        text: Elle échoue, car nginx est déjà là.
      - id: d
        text: Elle met nginx à jour vers la dernière version.
        feedback: "Ce serait `state: latest`."
    explanation: |
      On décrit un état, pas une action : c'est l'idempotence. Un module `shell` avec une
      commande brute n'a pas cette propriété.

  - id: devops.n4.helm.qcm-rollback
    type: qcm
    title: Revenir en arrière avec Helm
    skills: [helm]
    difficulty: 2
    prompt: "La révision 42 de la release `api` provoque des erreurs. La révision 41 fonctionnait. Quelle commande ?"
    choices:
      - id: a
        text: "helm rollback api 41"
        correct: true
      - id: b
        text: "helm delete api"
        feedback: "Ça supprime toute la release : coupure totale."
      - id: c
        text: "helm install api --version 41"
      - id: d
        text: "kubectl delete pods --all"
    explanation: |
      Chaque `helm upgrade` crée une révision ; `helm history api` les liste, `helm rollback`
      revient à l'une d'elles. Rétablir d'abord, comprendre ensuite.
