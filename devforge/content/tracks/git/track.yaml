id: git
title: Git et collaboration
description: >
  Versionner son code, travailler à plusieurs sans se marcher dessus, retrouver ce
  qu'on croyait perdu, et comprendre ce que Git fait vraiment.

levels:
  - level: 1
    title: Premiers commits
    skills:
      - id: trois-zones
        title: Répertoire de travail, index et dépôt
      - id: commits
        title: Faire de bons commits
      - id: historique
        title: Lire l'historique et les différences
      - id: gitignore
        title: Ignorer des fichiers
    boss:
      id: git.n1.boss
      title: "Boss : le premier commit"
      exercises:
        - git.n1.zones.qcm-mm
        - git.n1.commits.qcm-message
        - git.n1.zones.match
        - git.n1.gitignore.qcm-secret
      pass_ratio: 0.75
      time_limit_min: 8

  - level: 2
    title: Branches et collaboration
    skills:
      - id: branches
        title: Les branches
      - id: fusions
        title: Fusions et avance rapide
      - id: conflits
        title: Résoudre un conflit
      - id: depots-distants
        title: Dépôts distants, push et pull
      - id: pull-requests
        title: Pull requests et revue
    boss:
      id: git.n2.boss
      title: "Boss : le conflit de fusion"
      exercises:
        - git.n2.fusions.qcm-fast-forward
        - git.n2.conflits.parsons-resoudre
        - git.n2.distants.match
        - git.n2.pr.qcm-taille
        - git.n2.conflits.qcm-marqueurs
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 3
    title: Réécrire et retrouver
    skills:
      - id: rebase
        title: Rebase
      - id: annuler
        title: reset, revert et restore
      - id: reflog
        title: Retrouver ce qu'on croyait perdu (reflog)
      - id: bisect
        title: Trouver le commit fautif (bisect)
      - id: stash-cherry-pick
        title: stash et cherry-pick
    boss:
      id: git.n3.boss
      title: "Boss : l'historique réécrit"
      exercises:
        - git.n3.rebase.qcm-regle
        - git.n3.reflog.scenario-reset
        - git.n3.bisect.qcm-etapes
        - git.n3.outils.qcm-cherry-pick
        - git.n3.annuler.match
      pass_ratio: 0.8
      time_limit_min: 10

  - level: 4
    title: Travailler en équipe
    skills:
      - id: workflows
        title: Trunk-based, GitHub Flow, GitFlow
      - id: messages-commits
        title: Messages de commit et Conventional Commits
      - id: versions-tags
        title: Versions et tags
      - id: hooks
        title: Les hooks
    boss:
      id: git.n4.boss
      title: "Boss : la revue d'équipe"
      exercises:
        - git.n4.workflows.match
        - git.n4.conventions.qcm-version
        - git.n4.hooks.qcm
        - git.n4.conventions.fill
        - git.n3.reflog.scenario-reset
      pass_ratio: 0.8
      time_limit_min: 10

  - level: 5
    title: Git de l'intérieur
    skills:
      - id: objets-git
        title: Blobs, arbres et commits
      - id: references
        title: Références, HEAD et branches
      - id: gros-depots
        title: Les très gros dépôts
    boss:
      id: git.n5.boss
      title: "Boss : les entrailles de Git"
      exercises:
        - git.n5.historique.qcm-modifier
        - git.n5.gros-depots.match
        - git.n5.objets.qcm-hash
        - git.n5.objets.match
        - git.n5.references.qcm-branche
      pass_ratio: 0.8
      time_limit_min: 9
