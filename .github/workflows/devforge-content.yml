name: DevForge – contenu

on:
  push:
    paths:
      - "devforge/**"
      - ".github/workflows/devforge-content.yml"
  pull_request:
    paths:
      - "devforge/**"
      - ".github/workflows/devforge-content.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r devforge/tools/requirements.txt
      - name: Tester le validateur
        run: python -m unittest discover -s devforge/tools -v
      - name: Valider le contenu
        run: python devforge/tools/validate_content.py
