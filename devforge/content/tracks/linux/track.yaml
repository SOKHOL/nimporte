id: linux
title: Linux et shell
description: >
  Le terminal, les fichiers, les processus et les outils qui font tourner presque tous
  les serveurs du monde ; jusqu'à diagnostiquer une machine en production.

levels:
  - level: 1
    title: Le terminal
    skills:
      - id: navigation
        title: Naviguer dans les fichiers
      - id: permissions
        title: Les permissions
      - id: pipes-redirections
        title: Pipes et redirections
    boss:
      id: linux.n1.boss
      title: "Boss : le maître du terminal"
      exercises:
        - linux.n1.navigation.qcm-rm
        - linux.n1.permissions.match
        - linux.n1.pipes.parsons-erreurs
        - linux.n1.redirections.qcm-ordre
        - linux.n1.permissions.qcm-754
      pass_ratio: 0.8
      time_limit_min: 9

  - level: 2
    title: Les outils du quotidien
    skills:
      - id: texte
        title: grep, sort, uniq, awk, sed, find
      - id: scripts-bash
        title: Écrire des scripts bash fiables
      - id: processus-signaux
        title: Processus et signaux
      - id: environnement
        title: Variables d'environnement
    boss:
      id: linux.n2.boss
      title: "Boss : le script qui continue"
      exercises:
        - linux.n2.texte.match
        - linux.n2.scripts.bug-set-e
        - linux.n2.processus.qcm-signaux
        - linux.n2.environnement.qcm-export
        - linux.n2.scripts.trous-entete
        - linux.n2.scripts.qcm-guillemets
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 3
    title: Administrer une machine
    skills:
      - id: systemd
        title: Services avec systemd et journalctl
      - id: reseau-commandes
        title: Le réseau en ligne de commande
      - id: ssh
        title: SSH et clés
      - id: planification
        title: Tâches planifiées (cron, timers)
    boss:
      id: linux.n3.boss
      title: "Boss : le service fantôme"
      exercises:
        - linux.n3.systemd.scenario-demarrage
        - linux.n3.ssh.qcm-cles
        - linux.n3.planification.qcm-cron
        - linux.n3.systemd.trous-unit
        - linux.n3.reseau.match
        - linux.n3.reseau.qcm-refuse
      pass_ratio: 0.8
      time_limit_min: 12

  - level: 4
    title: Diagnostiquer
    skills:
      - id: charge-performance
        title: Charge, CPU, mémoire, disque
      - id: strace-lsof
        title: strace et lsof
      - id: systemes-fichiers
        title: Disques, inodes et systèmes de fichiers
      - id: conteneurs-linux
        title: cgroups et namespaces
    boss:
      id: linux.n4.boss
      title: "Boss : le disque plein qui ne l'est pas"
      exercises:
        - linux.n4.diagnostic.match
        - linux.n4.conteneurs.qcm
        - linux.n4.disques.scenario-disque-plein
        - linux.n4.strace.qcm-config
        - linux.n4.charge.qcm-load
        - linux.n4.memoire.qcm-free
      pass_ratio: 0.8
      time_limit_min: 11

  - level: 5
    title: Sous le capot
    skills:
      - id: appels-systeme
        title: Appels système
      - id: ordonnanceur
        title: L'ordonnanceur et la mémoire virtuelle
      - id: durcissement
        title: Durcir un serveur
      - id: ebpf
        title: eBPF, l'observabilité moderne
    boss:
      id: linux.n5.boss
      title: "Boss : le cœur du noyau"
      exercises:
        - linux.n5.appels-systeme.qcm-tampon
        - linux.n5.ordonnanceur.scenario-throttling
        - linux.n5.durcissement.match
        - linux.n5.ebpf.qcm-strace
        - linux.n5.durcissement.revue-sshd
        - linux.n5.memoire.qcm-rss
      pass_ratio: 0.8
      time_limit_min: 13
