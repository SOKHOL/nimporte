# Carte de tous les parcours de DevForge.
#
# - requires : liste de "parcours@niveau". Le niveau 1 du parcours se débloque
#   quand tous les prérequis sont atteints (ex. "poo@2" = niveau 2 de POO validé).
# - status   : "pilot" = le parcours a un dossier dans tracks/ avec du contenu ;
#              "planned" = prévu, pas encore rédigé.
# - domain   : axe du radar de compétences affiché dans le profil.

ranks:
  - level: 1
    name: Novice
    verb: découvrir
    description: Reconnaître et définir les concepts.
  - level: 2
    name: Apprenti
    verb: appliquer
    description: Utiliser les concepts sur des cas simples et guidés.
  - level: 3
    name: Compagnon
    verb: analyser
    description: Choisir la bonne solution, la justifier, détecter les problèmes.
  - level: 4
    name: Expert
    verb: concevoir
    description: Concevoir des solutions complètes et arbitrer des compromis.
  - level: 5
    name: Maître
    verb: transmettre
    description: Maîtriser les cas limites, enseigner, innover.

domains:
  - id: code
    title: Code
  - id: conception
    title: Conception
  - id: architecture
    title: Architecture
  - id: systemes
    title: Systèmes
  - id: ops
    title: Ops
  - id: data
    title: Data
  - id: securite
    title: Sécurité
  - id: humain
    title: Collaboration

tracks:
